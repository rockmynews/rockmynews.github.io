<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Name Check</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }

    #inputContainer {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      background-color: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      color: #333;
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <div id="inputContainer">
    <h2>Enter your first name:</h2>
    <input type="text" id="nameInput" placeholder="First name" />
    <button onclick="checkName()">Submit</button>
  </div>

  <p id="message"></p>

  <script>
    const encodedNames = ["YWJoYXk=", "YXNoaXRoYQ==", "YXBoaXJh", "Y2hyaXM=", "ZGFtb2Rhcg==", "ZGVlcHRp", "ZGhydXRp", "bWF6aGFy", "bWVlbmFrc2hp", "bXVyYWxp", "bmVpbA==", "bmlzaGFt", "cGFydGg=", "cHJhcnRoYW5h", "YnJpbmRoYQ==", "c2FuanBhbmE=", "c25laGE=", "dGFydW4=", "dHJpc3Rhbg==", "eXVrdGE="];
    const encodedSpecial = ["cHVuZWV0aA=="];
    const encodedBanned = "YXNodXRvc2g=";

    function decodeBase64(str) {
      try {
        return atob(str);
      } catch (e) {
        return "";
      }
    }

    const allowedNames = encodedNames.map(decodeBase64);
    const specialNames = encodedSpecial.map(decodeBase64);
    const bannedName = decodeBase64(encodedBanned);

    window.onload = () => {};

    function getCompareLength(name) {
      return 4;
    }

    function checkName() {
      const rawInput = document.getElementById("nameInput").value;
      const input = rawInput.trim().toLowerCase();
      const timestamp = new Date().toLocaleString();

      const isBannedInput = input.substring(0, 4) === bannedName.substring(0, 4);

      let specialMatch = "";
      for (const s of specialNames) {
        const len = getCompareLength(s);
        if (input.substring(0, len) === s.substring(0, len)) {
          specialMatch = s;
          break;
        }
      }

      const matches = allowedNames.filter(name => {
        const len = getCompareLength(name);
        return input.substring(0, len) === name.substring(0, len);
      });

      let matchedName = "";
      if (isBannedInput) {
        matchedName = bannedName;
      } else if (specialMatch) {
        matchedName = specialMatch;
      } else if (matches.length === 1) {
        matchedName = matches[0];
      } else {
        matchedName = "";
      }

      const history = JSON.parse(localStorage.getItem("submissionHistory")) || [];
      const puneethUsed = history.some(entry => entry.matchedName === specialNames[0]);
      const bannedUsed = history.some(entry => {
        return entry.matchedName === bannedName || 
               (entry.rawInput && entry.rawInput.toLowerCase().substring(0, 4) === bannedName.substring(0, 4));
      });

      saveSubmission(rawInput, matchedName, timestamp);

      if (puneethUsed) {
        document.getElementById("inputContainer").style.display = "none";
        document.getElementById("message").textContent = "nice try. not that foolish";
        return;
      }

      if (bannedUsed && !isBannedInput) {
        document.getElementById("inputContainer").style.display = "none";
        document.getElementById("message").textContent = "you've lied before";
        return;
      }

      if (isBannedInput) {
        document.getElementById("inputContainer").style.display = "none";
        document.getElementById("message").textContent = "lie. absolute lie. #Banned";
        return;
      }

      if (specialMatch) {
        document.getElementById("inputContainer").style.display = "none";
        document.getElementById("message").textContent = "how dare you think you will be allowed here";
        return;
      }

      if (matches.length === 1) {
        document.getElementById("inputContainer").style.display = "none";
        document.getElementById("message").textContent = "Hello, " + matchedName + "!";
        return;
      }

      document.body.innerHTML = "";
    }

    function saveSubmission(rawInput, matchedName, timestamp) {
      const history = JSON.parse(localStorage.getItem("submissionHistory")) || [];
      history.push({
        rawInput: rawInput,
        matchedName: matchedName,
        timestamp: timestamp
      });
      localStorage.setItem("submissionHistory", JSON.stringify(history));
    }
  </script>
</body>
</html>
