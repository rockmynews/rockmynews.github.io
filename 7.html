<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Name Check</title>
<style>*{box-sizing:border-box}body{margin:0;background:#cecece;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}@media(max-width:600px){body{justify-content:flex-start;padding-top:80px;height:auto}}#inputContainer{width:100%;max-width:400px;text-align:center}input{width:100%;padding:10px;font-size:16px;margin-bottom:10px}button{width:100%;padding:10px;font-size:16px;background:#007BFF;color:#fff;border:none;cursor:pointer;border-radius:4px}button:hover{background:#0056b3}#messageContainer{position:fixed;top:0;left:0;right:0;background:#007BFF;color:#fff;padding:15px 20px;font-size:20px;z-index:1001;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,0.2);display:flex;flex-direction:column;gap:4px;min-height:60px;justify-content:center;visibility:hidden}#greeting{margin:0}#slideshowNote{font-size:14px;color:#ffffff;text-shadow:0 0 3px rgba(0,0,0,0.6);margin:0}#slideshowContainer{width:100vw;margin-top:0;padding:0;overflow:hidden;display:none;flex-direction:column;justify-content:center;align-items:center;height:auto}#slideshowContainer img{max-width:98%;max-height:100%;width:auto;height:auto;display:block;margin:0 auto;object-fit:contain;padding-left:1%;padding-right:1%}#imageCaption{color:#fff;text-align:center;margin-top:8px;font-size:18px;font-weight:600;padding:8px 16px;background:rgba(0,0,0,0.6);border-radius:6px;max-width:90%;margin-left:auto;margin-right:auto;box-shadow:0 0 10px rgba(0,0,0,0.7);}</style>
</head>
<body>
<div id="inputContainer">
  <h2>Enter your first name:</h2>
  <input type="text" id="nameInput" placeholder="First Name Only" />
  <button onclick="checkName()">Submit</button>
</div>

<div id="messageContainer">
  <p id="greeting"></p>
  <p id="slideshowNote">Tap or swipe to change the image</p>
</div>

<div id="slideshowContainer">
  <img id="slideshowImage" src="" alt="Slideshow Image" />
  <p id="imageCaption"></p>
</div>

<script>
const encodedNames = ["YWJoYXk=", "YXNoaXRoYQ==", "YXBoaXJh", "Y2hyaXM=", "ZGFtb2Rhcg==", "ZGVlcHRp", "ZGhydXRp", "bWF6aGFy", "bWVlbmFrc2hp", "bXVyYWxp", "bmVpbA==", "bmlzaGFt", "cGFydGg=", "cHJhcnRoYW5h", "YnJpbmRoYQ==", "c2FuanBhbmE=", "c25laGE=", "dGFydW4=", "dHJpc3Rhbg==", "eXVrdGE="];
const encodedSpecial = ["cHVuZWV0aA=="];
const encodedBanned = "YXNodXRvc2g=";
function decodeBase64(str){try{return atob(str)}catch(e){return""}}
const allowedNames = encodedNames.map(decodeBase64);
const specialNames = encodedSpecial.map(decodeBase64);
const bannedName = decodeBase64(encodedBanned);
let currentImageIndex = 1;
const totalImages = 11; // total slideshow images

// Example captions for each image; you can customize these
const imageCaptions = [
  "Caption for image 1",
  "Caption for image 2",
  "Caption for image 3",
  "Caption for image 4"
];

function showNextImage(){
  currentImageIndex = (currentImageIndex % totalImages) + 1; 
  updateSlideshow();
}
function showPreviousImage(){
  currentImageIndex = (currentImageIndex - 2 + totalImages) % totalImages + 1; 
  updateSlideshow();
}
function updateSlideshow(){
  const img = document.getElementById("slideshowImage");
  const caption = document.getElementById("imageCaption");
  img.src = `v/${currentImageIndex}.jpg`;
  caption.textContent = imageCaptions[currentImageIndex - 1] || "";
}

function getCompareLength(name){return 4}
function saveSubmission(rawInput, matchedName, timestamp){
  const history=JSON.parse(localStorage.getItem("submissionHistory"))||[];
  history.push({rawInput:rawInput,matchedName:matchedName,timestamp:timestamp});
  localStorage.setItem("submissionHistory",JSON.stringify(history));
}
function checkName(){
  const rawInput=document.getElementById("nameInput").value;
  const input=rawInput.trim().toLowerCase();
  const timestamp=new Date().toLocaleString();
  const isBannedInput=input.substring(0,4)===bannedName.substring(0,4);
  let specialMatch="";
  for(const s of specialNames){
    const len=getCompareLength(s);
    if(input.substring(0,len)===s.substring(0,len)){
      specialMatch=s;break;
    }
  }
  const matches=allowedNames.filter(name=>{
    const len=getCompareLength(name);
    return input.substring(0,len)===name.substring(0,len);
  });
  let matchedName="";
  if(isBannedInput){
    matchedName=bannedName;
  } else if(specialMatch){
    matchedName=specialMatch;
  } else if(matches.length===1){
    matchedName=matches[0];
  } else {
    matchedName="";
  }
  const history=JSON.parse(localStorage.getItem("submissionHistory"))||[];
  const puneethUsed=history.some(entry=>entry.matchedName===specialNames[0]);
  const bannedUsed=history.some(entry=>entry.matchedName===bannedName||(entry.rawInput&&entry.rawInput.toLowerCase().substring(0,4)===bannedName.substring(0,4)));
  saveSubmission(rawInput,matchedName,timestamp);
  if(puneethUsed){
    document.getElementById("inputContainer").style.display="none";
    const msgElem=document.getElementById("messageContainer");
    msgElem.style.visibility="visible";
    document.getElementById("greeting").textContent="nice try. not that foolish";
    document.getElementById("slideshowNote").style.display="none";
    document.getElementById("slideshowContainer").style.display="none";
    return;
  }
  if(bannedUsed&&!isBannedInput){
    document.getElementById("inputContainer").style.display="none";
    const msgElem=document.getElementById("messageContainer");
    msgElem.style.visibility="visible";
    document.getElementById("greeting").textContent="you've lied before";
    document.getElementById("slideshowNote").style.display="none";
    document.getElementById("slideshowContainer").style.display="none";
    return;
  }
  if(isBannedInput){
    document.getElementById("inputContainer").style.display="none";
    const msgElem=document.getElementById("messageContainer");
    msgElem.style.visibility="visible";
    document.getElementById("greeting").textContent="lie. absolute lie. #Banned";
    document.getElementById("slideshowNote").style.display="none";
    document.getElementById("slideshowContainer").style.display="none";
    return;
  }
  if(specialMatch){
    document.getElementById("inputContainer").style.display="none";
    const msgElem=document.getElementById("messageContainer");
    msgElem.style.visibility="visible";
    document.getElementById("greeting").textContent="how dare you think you will be allowed here";
    document.getElementById("slideshowNote").style.display="none";
    document.getElementById("slideshowContainer").style.display="none";
    return;
  }
  if(matches.length===1){
    document.getElementById("inputContainer").style.display="none";
    const msgElem=document.getElementById("messageContainer");
    msgElem.style.visibility="visible";
    document.getElementById("greeting").textContent="Hello, "+matchedName+"!";
    document.getElementById("slideshowNote").style.display="block";
    document.getElementById("slideshowContainer").style.display="flex";
    currentImageIndex=1;
    updateSlideshow();
    adjustSlideshowHeight();
    return;
  }
  document.body.innerHTML="";
}

// Swipe support
let touchStartX=0,touchEndX=0;
const swipeThreshold=50;
const slideshowContainer=document.getElementById("slideshowContainer");
slideshowContainer.addEventListener("touchstart",e=>{touchStartX=e.changedTouches[0].screenX});
slideshowContainer.addEventListener("touchend",e=>{touchEndX=e.changedTouches[0].screenX;handleSwipeGesture()});
function handleSwipeGesture(){
  const swipeDistance=touchEndX-touchStartX;
  if(Math.abs(swipeDistance)<swipeThreshold)return;
  if(swipeDistance<0){showNextImage()}else{showPreviousImage()}
}
// Click on image to show next
document.getElementById("slideshowImage").addEventListener("click",showNextImage);

// Dynamic slideshow container height & margin fix
function adjustSlideshowHeight() {
  const headerHeight = document.getElementById('messageContainer').offsetHeight;
  const vh = window.innerHeight;
  const slideshow = document.getElementById('slideshowContainer');
  slideshow.style.height = (vh - headerHeight) + 'px';
  slideshow.style.marginTop = headerHeight + 'px';
}
window.addEventListener('resize', adjustSlideshowHeight);
window.addEventListener('orientationchange', adjustSlideshowHeight);
</script>
</body>
</html>
